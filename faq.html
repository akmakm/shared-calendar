<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petanque Assistant & FAQ</title>
    <link rel="stylesheet" href="style.css?v=3">

    <!-- REQUIRED: Firebase v8 Compat SDK CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div class="faq-wrapper">
    <div class="chat-container">
        <!-- Chat Header with Google Translate Widget -->
        <div class="chat-header">
            <img src="fanny2.png" alt="Fanny Cochonnet" style="width: 80px; height: 80px; border-radius: 0%; object-fit: cover;" />
            <h2>Pétanque AI FAQ</h2>
            <div id="google_translate_element"></div>
        </div>

        <!-- Chat Output -->
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                Hello! You are talking to AI chatbot by Aleksandr Kartomin. Ask me about petanque rules and umpiring.
            </div>
        </div>

        <!-- Quick Prompts -->
        <div class="quick-prompts">
            <button class="prompt-btn" onclick="sendQuickPrompt('What is the allowed cochonnet distance?')">Cochonnet distance</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('How does scoring work in Petanque?')">Scoring rules</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('What happens if two boules are equidistant?')">Equidistant boules</button>
        </div>

        <!-- Multi-line Responsive Input -->
        <div class="chat-input-area">
            <textarea 
                id="user-input" 
                class="chat-textarea" 
                placeholder="Type your petanque or calendar question here..."
                onkeydown="handleKeyDown(event)"></textarea>
            <div class="input-action-bar">
                <button class="send-btn" onclick="sendMessage()">Send Question</button>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html" class="back-link">← Back to Calendar Hub</a>
    </div>
</div>

<!-- Google Translate Initialization Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'bg,en,fr,sr,el,de,es,it,ro',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
    }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Load faq_bot.js as a module so it can access firebase-config.js and provide the fallback -->
<script type="module" src="faq_bot.js"></script>

<!-- Inline script linking frontend UI actions to your deployed Cloud Function with fallback -->
<script>
const CLOUD_FUNCTION_URL = 'https://askfaq-g4ecmrqqxq-uc.a.run.app';

function appendMessage(text, sender) {
    const chatMessages = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function submitQuestion(questionText) {
    if (!questionText.trim()) return;

    appendMessage(questionText, 'user');
    document.getElementById('user-input').value = '';

    // Create placeholder for bot response
    const chatMessages = document.getElementById('chat-messages');
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message bot';
    loadingDiv.textContent = 'Thinking...';
    chatMessages.appendChild(loadingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
        const response = await fetch(CLOUD_FUNCTION_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                question: questionText,
                language: 'en'
            })
        });

        if (!response.ok) {
            throw new Error(`Server returned status: ${response.status}`);
        }

        const data = await response.json();
        loadingDiv.textContent = data.answer || "Sorry, I couldn't find an answer.";
    } catch (error) {
        console.warn("Cloud Run backend unreachable. Invoking client-side fallback...", error);
    
        // Set input text back and call the suffixed fallback function
        const inputField = document.getElementById('user-input');
        inputField.value = questionText;
    
        if (typeof window.sendMessage_noAI === 'function') {
             window.sendMessage_noAI();
        } else {
            loadingDiv.textContent = "Sorry, I encountered an error connecting to the backend.";
        }
    }
}

function sendMessage() {
    const input = document.getElementById('user-input');
    submitQuestion(input.value);
}

function sendQuickPrompt(promptText) {
    submitQuestion(promptText);
}

function handleKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}
</script>

</body>
</html>
