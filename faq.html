<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petanque Assistant & FAQ</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div class="faq-wrapper">
    <div class="chat-container">
        <!-- Chat Header with Google Translate Widget -->
        <div class="chat-header">
            <h2>🤖 Petanque Assistant Bot</h2>
            <div id="google_translate_element"></div>
        </div>

        <!-- Chat Output -->
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                Hello! I am your Petanque Assistant. Ask me anything about official rules, measuring boules, scoring, or calendar synchronization!
            </div>
        </div>

        <!-- Quick Prompts -->
        <div class="quick-prompts">
            <button class="prompt-btn" onclick="sendQuickPrompt('What is the allowed cochonnet distance?')">Cochonnet distance</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('How does scoring work in Petanque?')">Scoring rules</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('What happens if two boules are equidistant?')">Equidistant boules</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('How do I subscribe to the calendar?')">Calendar sync</button>
        </div>

        <!-- Multi-line Responsive Input -->
        <div class="chat-input-area">
            <textarea 
                id="user-input" 
                class="chat-textarea" 
                placeholder="Type your petanque or calendar question here..."
                onkeydown="handleKeyDown(event)"></textarea>
            <div class="input-action-bar">
                <button class="send-btn" onclick="sendMessage()">Send Question</button>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html" class="back-link">← Back to Calendar Hub</a>
    </div>
</div>

<!-- Google Translate Integration Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'bg,en,fr,sr,de,es,it,ro,ru',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
    }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Interactive Assistant Logic -->
<script>
const chatMessages = document.getElementById('chat-messages');
const userInput = document.getElementById('user-input');

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function sendQuickPrompt(promptText) {
    userInput.value = promptText;
    sendMessage();
}

function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    userInput.value = '';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    setTimeout(() => {
        const reply = getBotReply(text);
        appendMessage(reply, 'bot');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }, 400);
}

function appendMessage(content, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = content;
    chatMessages.appendChild(msgDiv);
}

function getBotReply(query) {
    const q = query.toLowerCase();

    if (q.includes('distance') || q.includes('cochonnet') || q.includes('target') || q.includes('jack')) {
        return "Official FIPJP Rule: For standard adult competitions, the cochonnet must be thrown between 6 meters and 10 meters from the throwing circle, keeping at least 1 meter away from any obstacle or boundary.";
    } 
    if (q.includes('score') || q.includes('point') || q.includes('win')) {
        return "Scoring: The team with the boule closest to the cochonnet scores points. They receive 1 point for each boule closer to the cochonnet than the opponent's best boule. Games are played to 13 points.";
    } 
    if (q.includes('equidistant') || q.includes('equal') || q.includes('same distance') || q.includes('tie')) {
        return "If the closest boules belonging to opposing teams are equidistant from the cochonnet: If both teams have thrown all boules, the end is null (0 points scored). If boules remain, the team that threw last throws again.";
    } 
    if (q.includes('calendar') || q.includes('sync') || q.includes('ical') || q.includes('google') || q.includes('subscribe')) {
        return "To synchronize calendars: Click 'Subscribe (iCal/Webcal)' on the main page for live updating feeds on iOS, Mac, or Outlook. For Google Calendar, use the direct Google Calendar sync button.";
    } 
    if (q.includes('circle') || q.includes('foot') || q.includes('feet')) {
        return "The throwing circle must measure between 35cm and 50cm in diameter. Players must keep both feet fully inside the circle on the ground until their boule touches the terrain.";
    }

    return "Thanks for your question! I cover rules on cochonnet distances, equal-distance measurements, scoring, circle requirements, and calendar sync. Try picking one of the quick options above!";
}
</script>

</body>
</html>
