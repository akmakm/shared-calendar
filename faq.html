<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petanque Assistant & FAQ</title>
    <link rel="stylesheet" href="style.css?v=3">

    <!-- REQUIRED: Firebase v8 Compat SDK CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div class="faq-wrapper">
    <div class="chat-container">
        <!-- Chat Header with Google Translate Widget -->
        <div class="chat-header">
            <img src="fanny2.png" alt="Fanny Cochonnet" style="width: 80px; height: 80px; border-radius: 0%; object-fit: cover;" />
            <h2>Pétanque AI FAQ</h2>
            <div id="google_translate_element"></div>
        </div>

        <!-- Chat Output -->
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                Hello! You are talking to AI chatbot by Aleksandr Kartomin. Ask me about petanque rules and umpiring.
            </div>
        </div>

        <!-- Quick Prompts -->
        <div class="quick-prompts">
            <button class="prompt-btn" onclick="sendQuickPrompt('What is the allowed cochonnet distance?')">Cochonnet distance</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('How does scoring work in Petanque?')">Scoring rules</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('What happens if two boules are equidistant?')">Equidistant boules</button>
        </div>

        <!-- Multi-line Responsive Input -->
        <div class="chat-input-area">
            <textarea 
                id="user-input" 
                class="chat-textarea" 
                placeholder="Type your petanque or calendar question here..."
                onkeydown="handleKeyDown(event)"></textarea>
            <div class="input-action-bar">
                <button class="send-btn" onclick="sendMessage()">Send Question</button>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html" class="back-link">← Back to Calendar Hub</a>
    </div>
</div>

<!-- Google Translate Initialization Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'bg,en,fr,sr,el,de,es,it,ro',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
    }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Load faq_bot.js as a module so it can provide the client-side fallback -->
<script type="module" src="faq_bot.js"></script>

<!-- Inline script linking frontend UI actions to your deployed Cloud Function with fallback -->
<script>
const CLOUD_FUNCTION_URL = 'https://askfaq-g4ecmrqqxq-uc.a.run.app';

function appendMessage(text, sender) {
    const chatMessages = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msgDiv;
}

// Helper for feedback radiobtn
function makeThumbRadio(name, value, icon, text, onSelect) {
    const label = document.createElement('label');
    label.className = 'rag-thumb-option';

    const input = document.createElement('input');
    input.type = 'radio';
    input.name = name;
    input.value = value;

    const span = document.createElement('span');
    span.textContent = `${icon} ${text}`;

    input.addEventListener('change', () => {
        if (!input.checked) return;
        label.classList.add('selected');
        onSelect(input);
    });

    label.append(input, span);
    return { label, input };
}
// Helper to format bot responses with optional clickable source links safely
function setBotMessageContent(element, data, originalQuestion) {
    element.innerHTML = '';

    const answerDiv = document.createElement('div');
    answerDiv.textContent = data.answer || "Sorry, I couldn't find an answer.";

    if (data.matchType === 'rag_database' && data.docId) {
        const row = document.createElement('div');
        row.className = 'rag-response-row';

        const leftCol = document.createElement('div');
        leftCol.className = 'rag-answer-col';
        leftCol.appendChild(answerDiv);

        if (data.source) {
            const link = document.createElement('a');
            link.href = data.source;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '🔗 Source';
            link.style.display = 'block';
            link.style.marginTop = '4px';
            leftCol.appendChild(link);
        }

        const rightCol = document.createElement('div');
        rightCol.className = 'rag-side-panel';

        const matchText = document.createElement('div');
        matchText.textContent = `Best match in my knowledge base: ${data.confidence}`;

        const group = `fb_${data.docId}_${Date.now()}`;
        let done = false;

        const good = makeThumbRadio(group, 'good', '👍', 'Good answer', async () => {
            if (done) return;
            done = true;
            gemini.input.disabled = true;
            await fetch(`${CLOUD_FUNCTION_URL.replace(/\/$/, '')}/feedback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ docId: data.docId })
            });
            matchText.textContent = `Best match in my knowledge base: ${data.confidence} ✓`;
        });

        const gemini = makeThumbRadio(group, 'gemini', '👎', 'Ask Gemini', () => {
            if (done) return;
            done = true;
            good.input.disabled = true;
            gemini.input.disabled = true;
            submitQuestion(originalQuestion, true);
        });

        rightCol.append(matchText, good.label, gemini.label);
        row.append(leftCol, rightCol);
        element.appendChild(row);
        return;
    }

    // Direct Gemini fallback answer (either < 76% match or user clicked "Ask Gemini")
    element.appendChild(answerDiv);
    if (data.source) {
        const link = document.createElement('a');
        link.href = data.source;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '🔗 Source';
        link.style.display = 'block';
        link.style.marginTop = '6px';
        element.appendChild(link);
    }
}

// Helper to get active language from Google Translate or HTML tag
function getCurrentLanguage() {
    // Check Google Translate cookie if present (format: /en/bg or /auto/bg)
    const match = document.cookie.match(/(?:^|;\s*)googtrans=([^;]*)/);
    if (match) {
        const parts = match[1].split('/');
        if (parts.length >= 3 && parts[2]) {
            return parts[2]; // e.g. 'bg', 'fr', 'sr'
        }
    }
    // Fallback to html lang attribute or default to 'en'
    return document.documentElement.lang || 'en';
}

async function submitQuestion(questionText, forceAi = false) {
    if (!questionText.trim()) return;

    if (!forceAi) {
        appendMessage(questionText, 'user');
        document.getElementById('user-input').value = '';
    }

    const chatMessages = document.getElementById('chat-messages');
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message bot';
    loadingDiv.textContent = forceAi ? 'Asking Gemini...' : 'Thinking...';
    chatMessages.appendChild(loadingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    const activeLanguage = getCurrentLanguage();

    try {
        const response = await fetch(CLOUD_FUNCTION_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                question: questionText,
                language: activeLanguage,
                forceAi
            })
        });

        if (!response.ok) throw new Error(`Server returned status: ${response.status}`);

        const data = await response.json();
        setBotMessageContent(loadingDiv, data, questionText);
    } catch (error) {
        console.warn("Backend error:", error);
        loadingDiv.textContent = "Sorry, I encountered an error connecting to the backend.";
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById('user-input');
    submitQuestion(input.value);
}

function sendQuickPrompt(promptText) {
    submitQuestion(promptText);
}

function handleKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}
</script>

</body>
</html>
